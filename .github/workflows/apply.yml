name: apply

on:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    # Required reviewer on this environment gates every apply.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: eu-west-1
      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        run: |
          terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > /dev/null
          terraform show -no-color tfplan | grep -E '^(Plan:|No changes\.)' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: apply
        run: terraform apply -input=false -no-color tfplan | grep -E '^Apply complete!' | tee -a "$GITHUB_STEP_SUMMARY"
