name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@v6
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .checkov.yaml

  test:
    name: test (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [terraform, tofu]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "~1.12"
          tofu_wrapper: false
      - name: validate
        run: make validate TF=${{ matrix.tool }}
      - name: test
        run: make test TF=${{ matrix.tool }}

  plan:
    name: plan
    needs: [static, test]
    # OIDC tokens and secrets are not available to fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PLAN }}
          aws-region: eu-west-1
          mask-aws-account-id: true
      - name: init
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - name: plan
        # Full plan output contains account-specific ARNs; keep public logs to a summary.
        run: terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan > /dev/null
      - name: summarise
        run: |
          {
            echo '<!-- terraform-plan -->'
            echo '### Terraform plan'
            echo
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes\.)' || true
            echo
            echo '| Actions | Resource |'
            echo '|---|---|'
            terraform show -json tfplan | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "| \(.change.actions | join(", ")) | `\(.address)` |"'
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith('<!-- terraform-plan -->') && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
